# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set API_TOKEN=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# KHÔNG khai báo startCommand ở đây. Railway chạy startCommand không qua shell,
# nên "$PORT" đến uvicorn nguyên văn 5 ký tự và deploy chết với
# "Invalid value for '--port': '$PORT' is not a valid integer".
# Bỏ trống thì Railway dùng CMD của Dockerfile — CMD đó bọc `sh -c` nên
# ${PORT:-8000} được shell nội suy đúng.
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
